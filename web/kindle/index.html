<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#f7f4eb">
<meta name="description" content="TaskFlow — tờ giấy công việc tối giản dành cho Kindle.">
<title>TaskFlow · Tờ giấy</title>
<style>
:root{color-scheme:light;--paper:#f7f4eb;--ink:#25251f;--muted:#77746b;--line:#d8d2c4;--soft:#eeeadf}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper)}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--paper);background-image:repeating-linear-gradient(0deg,rgba(90,78,54,.025) 0,rgba(90,78,54,.025) 1px,transparent 1px,transparent 4px);font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{color:inherit;touch-action:manipulation}
.page{width:min(100%,700px);margin:0 auto;padding:28px 24px 36px}
.paper-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:10px}
h1{font-size:28px;font-weight:normal;letter-spacing:.01em;margin:0 0 2px}
.date{font-size:15px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.quiet-button{border:1px solid var(--line);background:transparent;border-radius:50%;width:42px;height:42px;font-family:Arial,sans-serif;font-size:22px;line-height:1}
.section-note{font-size:14px;color:var(--muted);margin:10px 0 12px}
#taskList{margin:0;padding:0;list-style:none}
.task{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line);min-height:58px}.task.repeat-task{grid-template-columns:82px minmax(0,1fr)}
.task-check{appearance:none;-webkit-appearance:none;width:27px;height:27px;border:1.7px solid var(--ink);border-radius:50%;background:transparent;margin:3px 0 0;display:grid;place-items:center;cursor:pointer}
.task-check:checked{background:var(--ink)}
.task-check:checked:after{content:"✓";font-family:Arial,sans-serif;font-size:17px;color:var(--paper);line-height:1}
.task-title{overflow-wrap:anywhere;white-space:pre-wrap}
.task.done .task-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.repeat-line{display:flex;align-items:center;gap:7px;margin-top:6px;font:14px/1.3 Arial,sans-serif;color:var(--muted)}.repeat-controls{display:flex;gap:5px;align-items:flex-start}.repeat-controls .repeat-button{width:36px;min-width:36px;height:38px;padding:0}.repeat-value{font:14px/1.4 Arial,sans-serif;color:var(--muted);margin-top:5px}
.repeat-value{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.repeat-button{min-width:42px;height:38px;padding:0 8px;border:1px solid var(--line);background:transparent;border-radius:4px;font:22px/1 Arial,sans-serif}
.repeat-button:disabled,.quiet-button:disabled{opacity:.35}
.empty{padding:26px 0;color:var(--muted);font-style:italic}
.status{font:13px/1.4 Arial,sans-serif;color:var(--muted);margin-top:18px;min-height:18px}
.auth{max-width:380px;margin:14vh auto 0;padding:0 24px}
.auth h1{margin-bottom:6px}
.auth p{font-size:16px;color:var(--muted);margin:0 0 24px}
.auth label{display:block;font-size:16px;margin:15px 0 6px}
.auth input{width:100%;padding:12px 10px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.35);color:var(--ink);font-family:Arial,sans-serif;font-size:16px}
.primary{width:100%;margin-top:20px;padding:12px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;font-size:17px}
.link{border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:14px;padding:8px 0}
.hidden{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(max-width:420px){.page{padding:20px 17px 28px}h1{font-size:25px}.task{gap:9px;grid-template-columns:32px minmax(0,1fr)}.task.repeat-task{grid-template-columns:78px minmax(0,1fr)}body{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
</head>
<body>
<section id="authScreen" class="auth">
  <h1>TaskFlow</h1><p>Một tờ giấy nhỏ cho những việc cần làm.</p>
  <form id="authForm">
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="loginButton" type="submit">Mở tờ giấy</button>
  </form>
  <div id="authStatus" class="status" role="status"></div>
</section>
<main id="app" class="page hidden">
  <header class="paper-head">
    <div><h1>Việc cần làm</h1><div id="todayDate" class="date"></div></div>
    <div class="tools"><button id="refresh" class="quiet-button" type="button" aria-label="Làm mới danh sách" title="Làm mới">↻</button></div>
  </header>
  <p class="section-note" id="summary">Những việc còn lại.</p>
  <ul id="taskList" aria-label="Danh sách công việc"></ul>
  <div id="empty" class="empty hidden">Tờ giấy đang trống. Thế cũng tốt.</div>
  <div id="status" class="status" role="status" aria-live="polite">Đang mở tờ giấy…</div>
  <button id="logout" class="link" type="button">Đăng xuất</button>
</main>
<script>
(function () {
  /* ES5-only Kindle version: avoid modern syntax unsupported by older Kindle browsers. */
  var $ = function (s) { return document.querySelector(s); };
  var config = window.TASKFLOW_CONFIG || {};
  var clientUrl = String(config.supabaseUrl || "").replace(/\/$/, "");
  var apiKey = String(config.supabaseAnonKey || "");
  var user = null, tasks = [], accessToken = "", refreshToken = "", expiresAt = 0, busy = {};
  var pollTimer = null;
  var columns = "id,user_id,title,scheduled_date,due_date,is_completed,completed_at,is_daily,daily_completed_on,repeat_enabled,repeat_total,repeat_remaining,position,archived_at,created_at";
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth()+1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function status(msg) { $("#status").textContent = msg; }
  function authStatus(msg) { $("#authStatus").textContent = msg; }
  function setDate() {
    /* Force Vietnam time (UTC+7), regardless of the Kindle's configured timezone. */
    var d = new Date(new Date().getTime() + 7 * 60 * 60 * 1000);
    var weekdays = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ Sáu", "Thứ bảy"];
    $("#todayDate").textContent = weekdays[d.getUTCDay()] + ", " + d.getUTCDate() + " tháng " + (d.getUTCMonth() + 1);
  }
  function showApp() { $("#authScreen").classList.add("hidden"); $("#app").classList.remove("hidden"); setDate(); }
  function showAuth() { $("#app").classList.add("hidden"); $("#authScreen").classList.remove("hidden"); }
  function request(method, path, body, token, callback) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, clientUrl + path, true);
    xhr.setRequestHeader("apikey", apiKey);
    xhr.setRequestHeader("Accept", "application/json");
    if (body !== null && typeof body !== "undefined") xhr.setRequestHeader("Content-Type", "application/json");
    if (token) xhr.setRequestHeader("Authorization", "Bearer " + token);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var data = null;
      try { data = xhr.responseText ? JSON.parse(xhr.responseText) : null; } catch (e) {}
      if (xhr.status >= 200 && xhr.status < 300) callback(null, data, xhr);
      else {
        var message = data && (data.msg || data.message || data.error_description || data.error);
        callback(new Error(message || ("Lỗi kết nối (" + xhr.status + ")")), data, xhr);
      }
    };
    xhr.onerror = function () { callback(new Error("Không kết nối được. Kiểm tra Wi-Fi trên Kindle.")); };
    try { xhr.send(body !== null && typeof body !== "undefined" ? JSON.stringify(body) : null); }
    catch (e) { callback(e); }
  }
  function saveSession(data) {
    accessToken = data.access_token || "";
    refreshToken = data.refresh_token || "";
    expiresAt = Math.floor(new Date().getTime()/1000) + Number(data.expires_in || 3600) - 30;
    try {
      localStorage.setItem("tf_kindle_session", JSON.stringify({
        access_token: accessToken, refresh_token: refreshToken, expires_at: expiresAt,
        user: data.user || user
      }));
    } catch (e) { /* Some Kindle browser modes do not persist local storage. */ }
    if (data.user) user = data.user;
  }
  function restoreSession() {
    try {
      var raw = localStorage.getItem("tf_kindle_session");
      if (raw) {
        var saved = JSON.parse(raw);
        accessToken = saved.access_token || "";
        refreshToken = saved.refresh_token || "";
        expiresAt = Number(saved.expires_at || 0);
        user = saved.user || null;
      }
    } catch (e) {}
  }
  function withFreshToken(callback) {
    if (accessToken && expiresAt > Math.floor(new Date().getTime()/1000)) {
      callback(null); return;
    }
    if (!refreshToken) { callback(new Error("Phiên đăng nhập hết hạn. Hãy đăng nhập lại.")); return; }
    request("POST", "/auth/v1/token?grant_type=refresh_token", {refresh_token:refreshToken}, null, function (err, data) {
      if (err) { callback(err); return; }
      saveSession(data); callback(null);
    });
  }
  function api(method, path, body, callback, retry) {
    withFreshToken(function (tokenError) {
      if (tokenError) { callback(tokenError); return; }
      request(method, path, body, accessToken, function (err, data, xhr) {
        if (err && xhr && xhr.status === 401 && !retry && refreshToken) {
          expiresAt = 0;
          api(method, path, body, callback, true);
        } else callback(err, data, xhr);
      });
    });
  }
  function activeTasks() {
    return tasks.filter(function (t) {
      return !t.archived_at && (t.repeat_enabled || !(t.is_daily ? t.daily_completed_on === today() : t.is_completed));
    });
  }
  function render() {
    var visible = activeTasks();
    visible.sort(function (a, b) {
      return Number(a.position || 0) - Number(b.position || 0) ||
        String(a.created_at || "").localeCompare(String(b.created_at || ""));
    });
    $("#taskList").innerHTML = visible.map(function (t) {
      var repeat = Boolean(t.repeat_enabled);
      var remain = Number(t.repeat_remaining == null ? (t.repeat_total || 1) : t.repeat_remaining);
      var control, counter = "";
      if (repeat) {
        control = '<div class="repeat-controls"><button class="repeat-button" type="button" data-repeat="1" data-id="' + esc(t.id) + '" aria-label="Ghi nhận một lần" ' + (remain <= 0 ? "disabled" : "") + '>+</button><button class="repeat-button" type="button" data-repeat="-1" data-id="' + esc(t.id) + '" aria-label="Hoàn tác một lần">−</button></div>';
        counter = '<div class="repeat-value">' + remain + " / " + Number(t.repeat_total || 1) + " lần còn lại</div>";
      } else {
        control = '<input class="task-check" type="checkbox" data-check="' + esc(t.id) + '" aria-label="Đánh dấu hoàn thành: ' + esc(t.title) + '" ' + ((t.is_completed || (t.is_daily && t.daily_completed_on === today())) ? "checked" : "") + '>';
      }
      var dailyDone = t.is_daily && t.daily_completed_on === today();
      return '<li class="task' + (repeat ? " repeat-task" : "") + ((t.is_completed || dailyDone) ? " done" : "") + '" data-row="' + esc(t.id) + '">' +
        control + '<div><div class="task-title">' + esc(t.title) + '</div>' + counter + '</div></li>';
    }).join("");
    $("#empty").classList.toggle("hidden", visible.length !== 0);
    $("#taskList").classList.toggle("hidden", visible.length === 0);
    $("#summary").textContent = visible.length ? visible.length + " việc còn lại" : "Không còn việc nào đang chờ.";
  }
  function load(silent) {
    if (!user) return;
    if (!silent) status("Đang đồng bộ…");
    api("GET", "/rest/v1/tasks?select=" + encodeURIComponent(columns) + "&user_id=eq." + encodeURIComponent(user.id) + "&archived_at=is.null&order=position.asc,created_at.asc", null, function (err, data) {
      if (err) {
        if (!silent) status("Chưa tải được việc: " + err.message + ". Kiểm tra Wi-Fi rồi chạm ↻.");
        return;
      }
      tasks = (data || []).map(function (t) {
        t.repeat_enabled = Boolean(t.repeat_enabled);
        t.repeat_total = Number(t.repeat_total || 1);
        t.repeat_remaining = Number(t.repeat_remaining == null ? t.repeat_total : t.repeat_remaining);
        return t;
      });
      render(); status("Đã đồng bộ với TaskFlow");
    });
  }
  function enter(nextUser) {
    user = nextUser;
    showApp();
    load(false);
    if (pollTimer) window.clearInterval(pollTimer);
    /* Older Kindle browsers may not support Realtime/WebSocket reliably; poll gently. */
    pollTimer = window.setInterval(function () { if (!document.hidden) load(true); }, 30000);
  }
  function signIn() {
    if (!clientUrl || !apiKey) { authStatus("Thiếu cấu hình Supabase trong web/config.js."); return; }
    restoreSession();
    if (!accessToken) return;
    withFreshToken(function (err) {
      if (err) { try { localStorage.removeItem("tf_kindle_session"); } catch (e) {} accessToken = ""; refreshToken = ""; user = null; return; }
      request("GET", "/auth/v1/user", null, accessToken, function (userErr, data) {
        if (!userErr && data && data.id) { user = data; enter(user); }
      });
    });
  }
  $("#authForm").addEventListener("submit", function (e) {
    if (e && e.preventDefault) e.preventDefault();
    var button = $("#loginButton");
    button.disabled = true; button.textContent = "Đang mở…"; authStatus("");
    if (!clientUrl || !apiKey) {
      authStatus("Thiếu cấu hình Supabase trong web/config.js.");
      button.disabled = false; button.textContent = "Mở tờ giấy"; return;
    }
    request("POST", "/auth/v1/token?grant_type=password", {
      email: $("#email").value.replace(/^\s+|\s+$/g, ""),
      password: $("#password").value
    }, null, function (err, data) {
      button.disabled = false; button.textContent = "Mở tờ giấy";
      if (err) { authStatus("Không đăng nhập được: " + err.message); return; }
      if (!data || !data.access_token || !data.user) { authStatus("Supabase chưa trả về phiên đăng nhập."); return; }
      saveSession(data); enter(data.user);
    });
  });
  function updateTask(id, patch, row) {
    if (busy[id]) return;
    busy[id] = true;
    if (row) {
      var controls = row.querySelectorAll("button,input");
      for (var i = 0; i < controls.length; i++) controls[i].disabled = true;
    }
    api("PATCH", "/rest/v1/tasks?id=eq." + encodeURIComponent(id) + "&user_id=eq." + encodeURIComponent(user.id), patch, function (err) {
      busy[id] = false;
      if (err) { status("Chưa lưu được thay đổi: " + err.message + ". Chạm ↻ để thử lại."); load(true); return; }
      load(true);
    });
  }
  $("#taskList").addEventListener("change", function (e) {
    var input = e.target;
    if (!input || !input.getAttribute || !input.getAttribute("data-check") || !user) return;
    var id = input.getAttribute("data-check"), task = null;
    for (var i = 0; i < tasks.length; i++) if (String(tasks[i].id) === String(id)) task = tasks[i];
    if (!task) return;
    var checked = input.checked, patch;
    if (task.is_daily) patch = {daily_completed_on:checked ? today() : null, is_completed:checked, completed_at:checked ? new Date().toISOString() : null};
    else patch = {is_completed:checked, completed_at:checked ? new Date().toISOString() : null};
    updateTask(task.id, patch, input.parentNode.parentNode);
  });
  $("#taskList").addEventListener("click", function (e) {
    var node = e.target, button = null;
    while (node && node !== this) {
      if (node.getAttribute && node.getAttribute("data-repeat")) { button = node; break; }
      node = node.parentNode;
    }
    if (!button || !user) return;
    var id = button.getAttribute("data-id"), task = null;
    for (var i = 0; i < tasks.length; i++) if (String(tasks[i].id) === String(id)) task = tasks[i];
    if (!task || !task.repeat_enabled) return;
    var delta = Number(button.getAttribute("data-repeat"));
    var remaining = Number(task.repeat_remaining == null ? task.repeat_total : task.repeat_remaining);
    var next = Math.max(0, remaining - delta);
    if (next === remaining) return;
    var finished = next === 0;
    updateTask(task.id, {repeat_remaining:next,is_completed:finished,completed_at:finished ? (task.completed_at || new Date().toISOString()) : null}, button.parentNode.parentNode.parentNode);
  });
  $("#refresh").addEventListener("click", function () { load(false); });
  $("#logout").addEventListener("click", function () {
    if (pollTimer) window.clearInterval(pollTimer);
    try { localStorage.removeItem("tf_kindle_session"); } catch (e) {}
    accessToken = ""; refreshToken = ""; user = null; tasks = [];
    showAuth(); authStatus("Đã đăng xuất.");
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && user) load(true); });
  window.addEventListener("online", function () { if (user) load(true); });
  signIn();
})();
</script>
</body>
</html>
