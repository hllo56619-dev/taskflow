name: Build TaskFlow for iPhone

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build native iOS app
    runs-on: macos-15
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Xcode project generator
        run: brew install xcodegen

      - name: Generate TaskFlow app icon
        run: swift ios/scripts/generate_app_icon.swift ios/TaskFlow/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Package Xcode project for opening on Mac
        run: |
          mkdir -p "$RUNNER_TEMP/TaskFlowXcodeProject"
          ditto ios/TaskFlow.xcodeproj "$RUNNER_TEMP/TaskFlowXcodeProject/TaskFlow.xcodeproj"
          ditto ios/TaskFlow "$RUNNER_TEMP/TaskFlowXcodeProject/TaskFlow"
          mkdir -p "$RUNNER_TEMP/TaskFlowXcodeProject/scripts"
          cp ios/scripts/generate_app_icon.swift "$RUNNER_TEMP/TaskFlowXcodeProject/scripts/generate_app_icon.swift"
          cp ios/project.yml "$RUNNER_TEMP/TaskFlowXcodeProject/project.yml"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/TaskFlowXcodeProject" \
            "$RUNNER_TEMP/TaskFlow-iOS-Xcode-Project.zip"

      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-iOS-Xcode-Project
          path: ${{ runner.temp }}/TaskFlow-iOS-Xcode-Project.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build for iPhone simulator
        run: |
          xcodebuild \
            -project ios/TaskFlow.xcodeproj \
            -scheme TaskFlow \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TaskFlowSimulator" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/TaskFlowSimulator/Build/Products/Debug-iphonesimulator/TaskFlow.app" \
            "$RUNNER_TEMP/TaskFlow-iOS-Simulator-App.zip"

      - name: Build unsigned iPhone device app
        run: |
          xcodebuild \
            -project ios/TaskFlow.xcodeproj \
            -scheme TaskFlow \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/TaskFlowDevice" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned device app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/TaskFlowDevice/Build/Products/Debug-iphoneos/TaskFlow.app" \
            "$RUNNER_TEMP/TaskFlow-iOS-Device-Unsigned-App.zip"

      - name: Package unsigned IPA for AltStore
        run: |
          mkdir -p "$RUNNER_TEMP/TaskFlowIPA/Payload"
          ditto "$RUNNER_TEMP/TaskFlowDevice/Build/Products/Debug-iphoneos/TaskFlow.app" \
            "$RUNNER_TEMP/TaskFlowIPA/Payload/TaskFlow.app"
          (cd "$RUNNER_TEMP/TaskFlowIPA" && /usr/bin/zip -qry "$RUNNER_TEMP/TaskFlow-Unsigned.ipa" Payload)

      - name: Upload IPA for AltStore
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-iOS-IPA-for-AltStore
          path: ${{ runner.temp }}/TaskFlow-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-iOS-Builds
          path: |
            ${{ runner.temp }}/TaskFlow-iOS-Simulator-App.zip
            ${{ runner.temp }}/TaskFlow-iOS-Device-Unsigned-App.zip
          if-no-files-found: error
          retention-days: 14
